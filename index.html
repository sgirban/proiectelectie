      const rom = ['XII','XI','X','IX','VIII','VII','VI','V','IV','III','II','I'];
      const m = t.match(/\b(XII|XI|X|IX|VIII|VII|VI|V|IV|III|II|I)\b/);
      if (m) return m[1];
      const n = parseInt((t.match(/\d+/) || [])[0], 10);
      return (n >= 1 && n <= 12) ? rom[12 - n] : 'IX';

                      <label key={idx} className="flex items-start gap-3 cursor-pointer p-2 rounded-lg hover:bg-white transition border border-transparent hover:border-gray-200">
                        <input type="checkbox" checked={selectedCompetencies.includes(comp)} onChange={() => handleCompetencyToggle(comp)} className="mt-1 w-4 h-4 text-primary rounded border-gray-300 focus:ring-primary" />
                        <span className="text-sm text-gray-700 leading-tight">{comp}</span>
                      </label>
                    ))}
                    {currentAvailableCompetencies.length === 0 && (
                      <p className="text-xs text-amber-700 bg-amber-50 p-2 rounded-lg">Nu există listă de competențe pentru această clasă/disciplină. Adaug-o manual mai jos.</p>
                    )}
                    {selectedCompetencies.filter(c => !currentAvailableCompetencies.includes(c)).map((c, i) => (
                      <div key={'cc' + i} className="text-sm text-gray-700 p-2">✔ {c}</div>
                    ))}
                  </div>
                  <div className="flex gap-2 mt-3">
                    <input type="text" value={customComp} onChange={e => setCustomComp(e.target.value)} placeholder="Competență adăugată manual (ex: 1.1. ...)" className="flex-1 px-3 py-1.5 text-sm border border-gray-300 rounded-lg outline-none" />
                    <button type="button" onClick={() => { if (customComp.trim()) { setSelectedCompetencies(p => [...p, customComp.trim()]); setCustomComp(''); } }} className="text-xs font-semibold bg-white border border-gray-300 px-3 py-1.5 rounded-lg">+ Adaugă</button>
                  </div>
                </div>
              )}

              <div>
                <div className="flex justify-between items-center mb-3">
                  <label className="block text-sm font-bold text-gray-700">Obiective operaționale</label>
                  <div className="flex gap-2">
                    <button onClick={addObjective} className="flex items-center text-xs font-semibold text-gray-700 bg-white border border-gray-300 px-3 py-1.5 rounded-lg hover:bg-gray-50 transition">
                      + Adaugă Obiectiv
                    </button>
                    <button 
                      onClick={generateObjectivesAI} 
                      disabled={isThinkingObj}
                      className="flex items-center text-xs font-semibold text-white bg-gradient-to-r from-purple-500 to-indigo-600 px-3 py-1.5 rounded-lg shadow-sm hover:opacity-90 transition disabled:opacity-50">
                      {isThinkingObj ? 'Se generează...' : <><SparklesIcon /> Generează 5 (AI)</>}
                    </button>
                  </div>
                </div>

                <div className="space-y-2">
                  {objectives.map((obj, index) => (
                    <div key={index} className="flex items-center gap-2 group">
                      <div className="bg-gray-100 text-gray-500 font-bold px-3 py-2 rounded-lg text-sm border border-gray-200 shadow-inner">O{index + 1}</div>
                      <input type="text" value={obj} onChange={(e) => handleObjectiveChange(index, e.target.value)} placeholder="Să..." className="flex-1 px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary outline-none text-sm" />
                      <button onClick={() => removeObjective(index)} className="opacity-0 group-hover:opacity-100 text-red-400 hover:text-red-600 px-2 transition-opacity">✕</button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>

          {/* Card 3: Etapele Lecției */}
          <div className="bg-surface shadow-sm border border-gray-100 rounded-2xl p-6 mb-6">
            <div className="flex justify-between items-center mb-4 border-b pb-4">
              <h2 className="text-xl font-semibold text-gray-800">3. {docType === 'proiect' ? 'Etapele Lecției' : 'Secvențele Lecției'}</h2>
              <div className="flex gap-2">
                <button onClick={addStage} className="text-sm bg-indigo-50 text-primary font-semibold py-2 px-4 rounded-lg hover:bg-indigo-100 transition-colors">
                  + Adaugă Etapă
                </button>
                <button 
                  onClick={generateAllStagesAI} 
                  disabled={isThinkingStages}
                  className="flex items-center text-sm font-semibold text-white bg-gradient-to-r from-purple-500 to-indigo-600 px-4 py-2 rounded-lg shadow-sm hover:opacity-90 transition disabled:opacity-50">
                  {isThinkingStages ? 'Se formulează scenariul...' : <><SparklesIcon /> Generează lecția (AI)</>}
                </button>
              </div>
            </div>
            
            <div className="space-y-6">
              {stages.map((stage, index) => (
                <div key={stage.id} className="p-4 border border-gray-200 rounded-xl bg-gray-50 relative">
                  <button onClick={() => removeStage(stage.id)} className="absolute top-2 right-2 text-red-400 hover:text-red-600 font-bold px-2 rounded">✕</button>
                  
                  <div className="flex justify-between items-center mb-3 pr-8">
                    <h3 className="text-sm font-bold text-gray-500 uppercase tracking-wider">Etapa {index + 1}</h3>
                    <button 
                      onClick={() => generateStageContentAI(stage.id)} 
                      disabled={generatingStageId === stage.id}
                      className="flex items-center text-xs font-semibold text-purple-600 bg-purple-100 hover:bg-purple-200 px-3 py-1.5 rounded-lg transition disabled:opacity-50" 
                      title="Completează automat restul câmpurilor bazat pe numele etapei"
                    >
                      <SparklesIcon /> {generatingStageId === stage.id ? 'Se generează...' : 'Completează doar această etapă'}
                    </button>
                  </div>
                  
                  <div className="grid grid-cols-1 md:grid-cols-12 gap-3">
                    <div className="md:col-span-4">
                      <label className="block text-xs font-medium text-gray-600 mb-1">Momentul lecției</label>
                      <ComboBox
                        value={stage.etapa}
                        onChange={(val) => handleStageChange(stage.id, 'etapa', val)}
                        options={isReligie(formData.disciplina) ? momenteReligie : momenteLectieOptions}
                        placeholder="Ex: Dirijarea învățării"
                        className="w-full px-3 py-1.5 text-sm border border-gray-300 rounded-lg outline-none font-medium bg-white"
                      />
                    </div>
                    <div className="md:col-span-2">
                      <label className="block text-xs font-medium text-gray-600 mb-1">Timp</label>
                      <input type="text" value={stage.timp} onChange={(e) => handleStageChange(stage.id, 'timp', e.target.value)} className="w-full px-3 py-1.5 text-sm border border-gray-300 rounded-lg outline-none" />
                    </div>
                    <div className="md:col-span-6">
                      <label className="block text-xs font-medium text-gray-600 mb-1">Obiective asociate</label>
                      <input type="text" value={stage.ob} onChange={(e) => handleStageChange(stage.id, 'ob', e.target.value)} className="w-full px-3 py-1.5 text-sm border border-gray-300 rounded-lg outline-none" />
                    </div>
                    
                    <div className="md:col-span-12">
                      <label className="block text-xs font-medium text-gray-600 mb-1">Conținutul învățării</label>
                      <textarea value={stage.continut} onChange={(e) => handleStageChange(stage.id, 'continut', e.target.value)} rows="2" className="w-full px-3 py-1.5 text-sm border border-gray-300 rounded-lg outline-none"></textarea>
                    </div>

                    <div className="md:col-span-4">
                      <label className="block text-xs font-medium text-gray-600 mb-1">Metode didactice</label>
                      <input type="text" value={stage.metode} onChange={(e) => handleStageChange(stage.id, 'metode', e.target.value)} className="w-full px-3 py-1.5 text-sm border border-gray-300 rounded-lg outline-none" />
                    </div>
                    <div className="md:col-span-4">
                      <label className="block text-xs font-medium text-gray-600 mb-1">Mijloace de înv.</label>
                      <input type="text" value={stage.mijloace} onChange={(e) => handleStageChange(stage.id, 'mijloace', e.target.value)} className="w-full px-3 py-1.5 text-sm border border-gray-300 rounded-lg outline-none" />
                    </div>
                    <div className="md:col-span-4">
                      <label className="block text-xs font-medium text-gray-600 mb-1">Forme organizare</label>
                      <input type="text" value={stage.forme} onChange={(e) => handleStageChange(stage.id, 'forme', e.target.value)} className="w-full px-3 py-1.5 text-sm border border-gray-300 rounded-lg outline-none" />
                    </div>

                    <div className="md:col-span-4">
                      <label className="block text-xs font-medium text-gray-600 mb-1">Tipul de învățare</label>
                      <input type="text" value={stage.tipInvatare} onChange={(e) => handleStageChange(stage.id, 'tipInvatare', e.target.value)} className="w-full px-3 py-1.5 text-sm border border-gray-300 rounded-lg outline-none" />
                    </div>
                    
                    {docType === 'proiect' && (
                      <div className="md:col-span-4">
                        <label className="block text-xs font-medium text-gray-600 mb-1">Interacțiunea CD-Elev</label>
                        <input type="text" value={stage.interactiune} onChange={(e) => handleStageChange(stage.id, 'interactiune', e.target.value)} className="w-full px-3 py-1.5 text-sm border border-gray-300 rounded-lg outline-none" />
                      </div>
                    )}

                    <div className={docType === 'proiect' ? "md:col-span-4" : "md:col-span-8"}>
                      <label className="block text-xs font-medium text-gray-600 mb-1">{docType === 'proiect' ? 'Evaluare' : 'Observații metodice'}</label>
                      <input type="text" value={docType === 'proiect' ? stage.evaluare : stage.observatii} onChange={(e) => handleStageChange(stage.id, docType === 'proiect' ? 'evaluare' : 'observatii', e.target.value)} className="w-full px-3 py-1.5 text-sm border border-gray-300 rounded-lg outline-none" />
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Card 4: Anexe (Opțional) */}
          <div className="bg-surface shadow-sm border border-gray-100 rounded-2xl p-6 mb-6">
            <div className="flex items-center justify-between">
              <h2 className="text-xl font-semibold text-gray-800">4. Anexe (Opțional)</h2>
              <label className="flex items-center cursor-pointer">
                <div className="relative">
                  <input 
                    type="checkbox" 
                    className="sr-only" 
                    checked={anexaData.hasAnexa} 
                    onChange={(e) => setAnexaData({...anexaData, hasAnexa: e.target.checked})} 
                  />
                  <div className={`block w-10 h-6 rounded-full transition-colors ${anexaData.hasAnexa ? 'bg-primary' : 'bg-gray-300'}`}></div>
                  <div className={`dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform ${anexaData.hasAnexa ? 'transform translate-x-4' : ''}`}></div>
                </div>
                <span className="ml-3 text-sm font-medium text-gray-700">Include Anexă pe pagină nouă</span>
              </label>
            </div>
            
            {anexaData.hasAnexa && (
              <div className="mt-6 pt-4 border-t border-gray-100 animate-fade-in">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Identificator (ex: Anexa 1)</label>
                    <input type="text" value={anexaData.label} onChange={(e) => setAnexaData({...anexaData, label: e.target.value})} className="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary outline-none" />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Titlu (Opțional)</label>
                    <input type="text" value={anexaData.titlu} onChange={(e) => setAnexaData({...anexaData, titlu: e.target.value})} placeholder="Ex: Funcții" className="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary outline-none" />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Tip Conținut (Subtitlu)</label>
                    <select value={anexaData.subtitlu} onChange={(e) => setAnexaData({...anexaData, subtitlu: e.target.value})} className="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary outline-none bg-white">
                      <option value="Nimic">Nimic (Scriu manual)</option>
                      <option value="Conținut lecție">Conținut lecție (Suport curs)</option>
                      <option value="Fișă de lucru">Fișă de lucru (Exerciții)</option>
                      <option value="Test de evaluare">Test de evaluare</option>
                    </select>
                  </div>
                </div>
                
                <div>
                  <div className="flex justify-between items-center mb-2">
                    <label className="block text-sm font-medium text-gray-700">Conținut Anexă </label>
                    <button 
                      type="button"
                      onClick={generateAnexaAI} 
                      disabled={isThinkingAnexa}
                      className="flex items-center text-xs font-semibold text-white bg-gradient-to-r from-purple-500 to-indigo-600 px-3 py-1.5 rounded-lg shadow-sm hover:opacity-90 transition disabled:opacity-50">
                      {isThinkingAnexa ? 'Se generează...' : <><SparklesIcon /> Generează Conținut (AI)</>}
                    </button>
                  </div>
                  <textarea 
                    value={anexaData.continut} 
                    onChange={(e) => setAnexaData({...anexaData, continut: e.target.value})} 
                    rows="8" 
                    placeholder="Aici va apărea conținutul generat sau poți scrie tu..." 
                    className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary outline-none font-mono text-sm leading-relaxed">
                  </textarea>
                </div>
              </div>
            )}
          </div>

          {/* Card 5: Export */}
          <div className="bg-surface shadow-sm border border-gray-100 rounded-2xl p-6">
            <h2 className="text-xl font-semibold mb-6 text-gray-800">5. Exportă Documentul</h2>
            
            {!resultLinks ? (
              <div className="flex justify-center">
                <button 
                  onClick={handleGenerateDoc} 
                  disabled={isGenerating}
                  className={`w-full max-w-md py-4 px-6 rounded-xl text-lg font-bold text-white shadow-lg transition-all flex items-center justify-center gap-3 ${isGenerating ? 'bg-gray-400 cursor-not-allowed' : 'bg-gradient-to-r from-primary to-secondary hover:scale-105'}`}
                >
                  <span className="text-2xl">{isGenerating ? '⏳' : '🪄'}</span> 
                  {isGenerating ? 'Se Generează Documentul...' : 'Generează Google Docs & PDF'}
                </button>
              </div>
            ) : (
              <div className="mt-2 p-6 bg-green-50 border border-green-200 rounded-xl flex flex-col items-center text-center animate-fade-in">
                <div className="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-2xl mb-3">✅</div>
                <h3 className="text-green-800 font-bold text-lg mb-1">Documentul a fost generat cu succes!</h3>
                <p className="text-green-600 text-sm mb-5">Poți vizualiza, edita sau descărca fișierul folosind link-urile de mai jos.</p>
                <div className="flex flex-col sm:flex-row gap-4 w-full justify-center">
                  <a href={resultLinks.docUrl} target="_blank" className="bg-blue-600 text-white px-6 py-3 rounded-xl text-sm font-semibold hover:bg-blue-700 shadow-md transition flex items-center justify-center gap-2 flex-1 max-w-xs">
                    <span className="text-lg">📄</span> Deschide Google Docs
                  </a>
                  <a href={resultLinks.pdfUrl} target="_blank" className="bg-red-50 text-red-600 border border-red-200 px-6 py-3 rounded-xl text-sm font-semibold hover:bg-red-100 shadow-sm transition flex items-center justify-center gap-2 flex-1 max-w-xs">
                    <span className="text-lg">⬇️</span> Descarcă PDF
                  </a>
                </div>
                <button onClick={() => setResultLinks(null)} className="mt-6 text-sm text-gray-500 hover:text-gray-700 underline">
                  Generează alt document
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
